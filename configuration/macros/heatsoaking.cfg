# WARNING: DO NOT EDIT THIS FILE
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.

#####
# CONFIGURATION VARIABLES
#####

[gcode_macro RatOS]
variable_bed_heat_soak_time: 0		# Fixed heat soak time for the bed in seconds (0 = no soak)
									# NB: Does not apply when a beacon probe is present and beacon adaptive heatsoaking is enabled.
variable_hotend_heat_soak_time: 0	# Fixed heat soak time for the hotends in seconds (0 = no soak)
									# NB: Does not apply when a beacon probe is present and beacon adaptive heatsoaking is enabled.

#####
# MACROS
#####

[gcode_macro RESET_HEATSOAK_SETTINGS]
description: Resets all heatsoak-related settings to startup defaults
gcode:
	HEATSOAK_SETTINGS ACTION=reset

[gcode_macro HEATSOAK_SETTINGS]
description: Shows or adjusts heatsoak settings
	- With no arguments: shows current heatsoak settings
	- With arguments: sets the specified setting. Use the full setting name, or one of these shortcuts:
		- MODE=adaptive|fixed|off (off selects fixed mode and sets the bed heat soak time to zero)
		- FIRST_LAYER_S=seconds : maximum first layer duration in seconds
		- FIRST_LAYER_M=minutes : maximum first layer duration in minutes
		- QUALITY=1..5 : sets adaptive soak quality
		- FIXED_S=seconds : fixed soak duration in seconds
		- FIXED_M=minutes : fixed soak duraiton in minutes
	- For shortcuts with minutes/seconds alternatives, specify either as minutes or as seconds, not both.
gcode:
	# This macro is designed for console or Mainsail macro button use.
	# Shortcut names have been chosen to fit in mainsail macro button parameter pop ups, which
	# have limited length.
	{% set has_beacon = printer.fastconfig.settings.beacon is defined %}
	# Avoid unwanted param detection by mainsail: uses of params2 won't be noticed.
	{% set params2 = params %}
	# Define selected short names for common params. These will be picked up by mainsail macro buttons.
	{% if params2.MODE is defined %}
	{% set _ = params.MODE|default("adaptive | fixed | off") %} # this is just a hint for mainsail UI
	{% if params2.MODE|lower not in ("adaptive", "fixed", "off") %}
		{ action_raise_error("MODE must be adaptive, fixed or off") }
	{% endif %}
	{% if params2.MODE|lower == "adaptive" %}
		{% if has_beacon %}		
			{% set _ = params2.update({"beacon_adaptive_heat_soak": True }) %}
		{% else %}
			{ action_raise_error("Adaptive heatsoaking is only available when a beacon probe is configured.") }
		{% endif %}
	{% elif params2.MODE|lower == "fixed" %}
		{% if has_beacon %}
			{% set _ = params2.update({"beacon_adaptive_heat_soak": False }) %}
		{% endif %}
	{% elif params2.MODE|lower == "off" %}
		{% if has_beacon %}
			{% set _ = params2.update({"beacon_adaptive_heat_soak": False }) %}
		{% endif %}
		{% set _ = params2.update({"bed_heat_soak_time": 0 }) %}
	{% endif %}
		{% set _ = params2.pop("MODE", None) %}
	{% endif %}
	{% if not has_beacon and (params2.FIRST_LAYER_S is defined or params2.FIRST_LAYER_M is defined or params2.QUALITY is defined) %}
		{ action_raise_error("Adaptive heatsoaking settings can only be set when a beacon probe is configured.") }
	{% endif %}
	{% if params2.FIRST_LAYER_S is defined and params2.FIRST_LAYER_M is defined %}
		{ action_raise_error("You must specify at most one of FIRST_LAYER_M and FIRST_LAYER_S, not both.") }
	{% endif %}
	{% if params2.FIRST_LAYER_S is defined %}
		{% set _ = params2.update({"beacon_adaptive_heat_soak_maximum_first_layer_duration": params.FIRST_LAYER_S|int }) %}
		{% set _ = params2.pop("FIRST_LAYER_S", None) %}
	{% endif %}
	{% if params2.FIRST_LAYER_M is defined %}
		{% set _ = params2.update({"beacon_adaptive_heat_soak_maximum_first_layer_duration": (params.FIRST_LAYER_M|float * 60.0)|int }) %}
		{% set _ = params2.pop("FIRST_LAYER_M", None) %}
	{% endif %}
	{% if params2.QUALITY is defined %}
		{% if params2.QUALITY|int < 1 or params2.QUALITY|int > 5 %}
			{ action_raise_error("QUALITY must be between 1 and 5 (inclusive)") }
		{% endif %}
		{% set _ = params2.update({"beacon_adaptive_heat_soak_layer_quality": params.QUALITY|int }) %}
		{% set _ = params2.pop("QUALITY", None) %}
	{% endif %}
	{% if params2.FIXED_M is defined and params2.FIXED_S is defined %}
		{ action_raise_error("You must specify at most one of FIXED_M and FIXED_S, not both.") }
	{% endif %}
	{% if params2.FIXED_S is defined %}
		{% set _ = params2.update({"bed_heat_soak_time": params.FIXED_S|int }) %}
		{% set _ = params2.pop("FIXED_S", None) %}
	{% endif %}
	{% if params2.FIXED_M is defined %}
		{% set _ = params2.update({"bed_heat_soak_time": (params.FIXED_M|float * 60.0)|int }) %}
		{% set _ = params2.pop("FIXED_M", None) %}
	{% endif %}
	{% if has_beacon %}
		{% set vars = (
			"beacon_adaptive_heat_soak",
			"beacon_adaptive_heat_soak_max_wait",
			"beacon_adaptive_heat_soak_extra_wait_after_completion",
			"beacon_adaptive_heat_soak_layer_quality",
			"beacon_adaptive_heat_soak_maximum_first_layer_duration",
			"bed_heat_soak_time",
			"hotend_heat_soak_time",
			) %}
	{% else %}
		{% set vars = (
			"bed_heat_soak_time",
			"hotend_heat_soak_time",
			) %}
	{% endif %}
	{% set action = "show" if params|length == 0 else params2.ACTION %}
		{% if action is defined and params|length > 1 %}
	{ action_raise_error("ACTION cannot be specified with other parameters.") }
	{% elif action is not defined %}
		{% for k, v in params2.items() %}
			{% set k = k|lower %}
			{% if k in vars %}
				CONSOLE_ECHO MSG="Setting {k} to {v}"
				SET_GCODE_VARIABLE MACRO=RatOS VARIABLE={k} VALUE={v}
			{% else %}
				{ action_raise_error("Parameter '%s' is not recognised. Note that adaptive heatsoaking settings can only be set when a beacon probe is configured." % k) }
			{% endif %}
		{% endfor %}
	{% elif action == "reset" %}
		_RESET_GCODE_VARIABLES MACRO=RatOS VARIABLES={vars|join(',')} SKIP_UNDEFINED_VARIABLES=1
		CONSOLE_ECHO MSG="Heatsoak settings have been reset to their original values."
	{% elif action == "show" %}
		CONSOLE_ECHO MSG="Current heatsoak settings:"
		_SHOW_GCODE_VARIABLES MACRO=RatOS VARIABLES={vars|join(',')} SKIP_UNDEFINED_VARIABLES=1
	{% else %}
		{ action_raise_error("Action '%s' is not recognised" % action) }
	{% endif %}
